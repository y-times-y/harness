<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" role="img" aria-label="A real program from a ytimesy run: one run_code call that runs one bash command and four file reads in parallel, and returns their output as one result."><style>.n{fill:#ffffff;stroke:#dfdfdd}.n-dark{fill:#191918;stroke:#191918}.n-soft{fill:#f2f2f0;stroke:#dfdfdd}.e{fill:none;stroke:#aeaeac;stroke-width:1.25}.e-dash{fill:none;stroke:#aeaeac;stroke-width:1.25;stroke-dasharray:3 3}.ah{fill:#aeaeac}.t{fill:#191918;font:500 14px sans-serif}.t-l{fill:#191918;font:400 13px sans-serif}.t-s{fill:#6e6e6d;font:400 12.5px sans-serif}.t-x{fill:#a0a09e;font:400 12px sans-serif}.t-m{fill:#191918;font:400 12.5px monospace}.t-inv{fill:#fafaf8;font:500 14px sans-serif}.t-inv-s{fill:#b6b6b5;font:400 12.5px sans-serif}.code{fill:#191918;font:11.5px monospace;white-space:pre}.bg{fill:#f2f2f0;stroke:#dfdfdd}@media (prefers-color-scheme: dark){.n{fill:#1c1c1b;stroke:#2e2e2c}.n-dark{fill:#ecebe7;stroke:#ecebe7}.n-soft{fill:#1c1c1a;stroke:#2e2e2c}.e{fill:none;stroke:#5d5d5b;stroke-width:1.25}.e-dash{fill:none;stroke:#5d5d5b;stroke-width:1.25;stroke-dasharray:3 3}.ah{fill:#5d5d5b}.t{fill:#ecebe7;font:500 14px sans-serif}.t-l{fill:#ecebe7;font:400 13px sans-serif}.t-s{fill:#9a9996;font:400 12.5px sans-serif}.t-x{fill:#6a6a68;font:400 12px sans-serif}.t-m{fill:#ecebe7;font:400 12.5px monospace}.t-inv{fill:#141413;font:500 14px sans-serif}.t-inv-s{fill:#555453;font:400 12.5px sans-serif}.code{fill:#ecebe7;font:11.5px monospace;white-space:pre}.bg{fill:#1c1c1a;stroke:#2e2e2c}}</style><rect x="0.5" y="0.5" width="759" height="331" rx="14" class="bg"/>
			<defs><marker id="a2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ah"/></marker></defs>
			<rect x="32" y="32" width="380" height="268" rx="10" class="n"/>
			<text x="52" y="60" class="t">One model call</text>
			<text x="392" y="60" class="t-x" text-anchor="end">run_code</text>
			<text x="52" y="90.0" class="code" xml:space="preserve">return await Promise.all([</text><text x="52" y="109.8" class="code" xml:space="preserve">  tools.bash({ command:</text><text x="52" y="129.6" class="code" xml:space="preserve">    "pwd &amp;&amp; ls -la &amp;&amp; nvidia-smi &amp;&amp;</text><text x="52" y="149.4" class="code" xml:space="preserve">     cat ~/.ytimesy/environment.md 2&gt;/dev/null",</text><text x="52" y="169.2" class="code" xml:space="preserve">    timeout: 120 }),</text><text x="52" y="189.0" class="code" xml:space="preserve">  tools.read({ path: "fp8_rmsnorm_gemm.cu" }),</text><text x="52" y="208.8" class="code" xml:space="preserve">  tools.read({ path: "build.sh" }),</text><text x="52" y="228.6" class="code" xml:space="preserve">  tools.read({ path:</text><text x="52" y="248.4" class="code" xml:space="preserve">    "fp8_rmsnorm_gemm_dispatch.py" }),</text><text x="52" y="268.2" class="code" xml:space="preserve">  tools.read({ path: "example.py" }),</text><text x="52" y="288.0" class="code" xml:space="preserve">]);</text>
			<path d="M412 166 H 432" class="e"/>
			<path d="M432 166 V 78 Q 432 70 440 70 H 451" class="e" marker-end="url(#a2)"/>
			<path d="M432 166 V 126 Q 432 118 440 118 H 451" class="e" marker-end="url(#a2)"/>
			<path d="M432 166 H 451" class="e" marker-end="url(#a2)"/>
			<path d="M432 166 V 206 Q 432 214 440 214 H 451" class="e" marker-end="url(#a2)"/>
			<path d="M432 166 V 254 Q 432 262 440 262 H 451" class="e" marker-end="url(#a2)"/>
			<rect x="452" y="54" width="160" height="32" rx="8" class="n"/><text x="466" y="75" class="t-m">bash</text><text x="598" y="75" class="t-x" text-anchor="end">machine state</text>
			<rect x="452" y="102" width="160" height="32" rx="8" class="n"/><text x="466" y="123" class="t-m">read</text><text x="598" y="123" class="t-x" text-anchor="end">kernel</text>
			<rect x="452" y="150" width="160" height="32" rx="8" class="n"/><text x="466" y="171" class="t-m">read</text><text x="598" y="171" class="t-x" text-anchor="end">build script</text>
